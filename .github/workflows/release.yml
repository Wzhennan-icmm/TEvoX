name: Release source archive
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check
      - run: git archive --format=tar.gz --prefix="TEvoX-${GITHUB_REF_NAME}/" -o "TEvoX-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: TEvoX-${{ github.ref_name }}-source
          path: TEvoX-${{ github.ref_name }}.tar.gz
